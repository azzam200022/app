name: Android preview APK (Gradle)

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/android-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-apk:
    name: Build preview APK with Gradle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1"

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Generate Android project
        working-directory: frontend
        run: npx expo prebuild --platform android --no-install

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK with Gradle
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: market-bin-saleem-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Add download link to run summary
        env:
          ARTIFACT_URL: ${{ steps.upload-apk.outputs.artifact-url }}
        run: |
          {
            echo "## Android debug APK is ready"
            echo ""
            echo "[Download the APK artifact]($ARTIFACT_URL)"
            echo ""
            echo "Built with Gradle assembleDebug on ubuntu-latest (debug-signed; for testing)."
          } >> "$GITHUB_STEP_SUMMARY"
